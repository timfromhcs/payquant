<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="100%" stop-color="#12122b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7b2fbe" />
    </linearGradient>
  </defs>
  <rect width="1000" height="500" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)"/>
  
  <text x="500" y="50" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="url(#nodeGrad)" text-anchor="middle">PayQuant Architecture &amp; Core Pipeline</text>
  
  <!-- Nodes -->
  <g transform="translate(100, 120)">
    <rect width="220" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="#00d4ff" stroke-width="2"/>
    <text x="110" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle">Post-Quantum</text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">ML-DSA-65 / SLH-DSA</text>
  </g>

  <g transform="translate(390, 120)">
    <rect width="220" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="#7b2fbe" stroke-width="2"/>
    <text x="110" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#7b2fbe" text-anchor="middle">Synergeia Consensus</text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">PoW + 27 PoS Validators</text>
  </g>

  <g transform="translate(680, 120)">
    <rect width="220" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="#00ffaa" stroke-width="2"/>
    <text x="110" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#00ffaa" text-anchor="middle">PoUW + ZKML</text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">AI Compute Verification</text>
  </g>

  <!-- Connectors -->
  <line x1="320" y1="170" x2="390" y2="170" stroke="#00d4ff" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="610" y1="170" x2="680" y2="170" stroke="#7b2fbe" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Second Row -->
  <g transform="translate(100, 300)">
    <rect width="220" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="#ffaa00" stroke-width="2"/>
    <text x="110" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffaa00" text-anchor="middle">RinHash Mining</text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">BLAKE3+Argon2d+SHA3</text>
  </g>

  <g transform="translate(390, 300)">
    <rect width="220" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="#00d4ff" stroke-width="2"/>
    <text x="110" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle">FMARL AI Agent</text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">Dynamic Telemetry Tuning</text>
  </g>

  <g transform="translate(680, 300)">
    <rect width="220" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="#ff007f" stroke-width="2"/>
    <text x="110" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ff007f" text-anchor="middle">Treasury &amp; Sentinel</text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">Spenden-Wallet &amp; Qiskit</text>
  </g>

  <!-- Vertical Connectors -->
  <line x1="210" y1="220" x2="210" y2="300" stroke="#00d4ff" stroke-width="2"/>
  <line x1="500" y1="220" x2="500" y2="300" stroke="#7b2fbe" stroke-width="2"/>
  <line x1="790" y1="220" x2="790" y2="300" stroke="#00ffaa" stroke-width="2"/>
</svg>
