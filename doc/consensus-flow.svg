<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#7b2fbe" />
      <stop offset="100%" stop-color="#00ffaa" />
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="16" fill="#060913" stroke="rgba(255,255,255,0.1)"/>
  <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="url(#flowGrad)" text-anchor="middle">Synergeia Consensus Flow (15s Finality)</text>
  
  <g transform="translate(50, 110)">
    <circle cx="60" cy="50" r="45" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="2"/>
    <text x="60" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#00d4ff" text-anchor="middle">PoW Mining</text>
  </g>

  <line x1="170" y1="160" x2="250" y2="160" stroke="url(#flowGrad)" stroke-width="4"/>

  <g transform="translate(250, 110)">
    <circle cx="60" cy="50" r="45" fill="rgba(123,47,190,0.1)" stroke="#7b2fbe" stroke-width="2"/>
    <text x="60" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7b2fbe" text-anchor="middle">27 PoS Nodes</text>
  </g>

  <line x1="370" y1="160" x2="450" y2="160" stroke="url(#flowGrad)" stroke-width="4"/>

  <g transform="translate(450, 110)">
    <circle cx="60" cy="50" r="45" fill="rgba(0,255,170,0.1)" stroke="#00ffaa" stroke-width="2"/>
    <text x="60" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#00ffaa" text-anchor="middle">67% Supermajority</text>
  </g>

  <line x1="570" y1="160" x2="650" y2="160" stroke="url(#flowGrad)" stroke-width="4"/>

  <g transform="translate(650, 110)">
    <circle cx="60" cy="50" r="45" fill="rgba(255,0,127,0.1)" stroke="#ff007f" stroke-width="2"/>
    <text x="60" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ff007f" text-anchor="middle">Block Finalized</text>
  </g>
</svg>
