<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuant 3D Quantum Diamond Explorer</title>
<style>
  :root{--bg:#060814;--panel:#0c0f24;--text:#e0e0e0;--muted:#8899aa;--accent:#8B5CF6;--glow:#ff7eb3}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(1000px 500px at 85% -10%,rgba(139,92,246,.16),transparent 60%),
       radial-gradient(700px 400px at -10% 110%,rgba(255,126,179,.12),transparent 55%),var(--bg);
       color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
  #c3d{position:fixed;inset:0;display:block;touch-action:none}
  #ui{position:fixed;left:18px;top:16px;z-index:20;max-width:420px}
  h1{font-size:1.35rem;font-weight:800;background:linear-gradient(90deg,#ff7eb3,#ffd77d,#4ECDC4);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  #sub{color:var(--muted);font-size:0.78rem;margin-top:4px}
  #panel{position:fixed;right:16px;bottom:16px;z-index:20;background:var(--panel);
    border:1px solid rgba(255,126,179,.35);border-radius:14px;padding:12px 14px;min-width:250px;
    box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #panel h2{color:var(--glow,#ff7eb3);font-size:0.85rem;margin-bottom:6px}
  #meta{font-family:monospace;font-size:0.72rem;color:var(--muted);line-height:1.55;word-break:break-all}
  #controls{position:fixed;left:16px;bottom:16px;z-index:20}
  #controls button{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.15);
    border-radius:9px;padding:7px 13px;font-size:0.78rem;font-weight:600;cursor:pointer;margin-right:6px;transition:.2s}
  #controls button:hover{background:rgba(139,92,246,.35);transform:translateY(-1px)}
  #gallery{position:fixed;top:64px;right:16px;z-index:25;max-height:72vh;overflow-y:auto;
    background:rgba(12,15,36,.9);border:1px solid rgba(255,255,255,.12);border-radius:12px;
    padding:10px;width:330px;display:none}
  .thumb{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;
    font-size:0.72rem;color:var(--muted)}
  .thumb:hover{background:rgba(139,92,246,.22);color:#fff}
  .thumb canvas{border-radius:7px;background:#10142c}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:40;
    background:#0a3d2e;border:1px solid #00ffaa;color:#fff;padding:10px 18px;
    border-radius:12px;font-size:.85rem;opacity:0;transition:opacity .4s}
  .badge{display:inline-block;background:rgba(139,92,246,.25);border:1px solid rgba(139,92,246,.6);
    color:#d9c7ff;border-radius:8px;padding:2px 8px;font-size:0.68rem;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="ui">
  <h1>PayQuant 3D Quantum Diamond</h1>
  <div id="sub">Zero-Port P2P · Post-Quantum ML-DSA-65 · One unique diamond per block<span id="ver" class="badge">v2.0.0-quantum</span></div>
</div>
<div id="gallery"></div>
<div id="controls">
  <button onclick="toggleGallery()">◈ Gallery</button>
  <button onclick="cycle(1)">Next ▸</button>
  <button onclick="cycle(-1)">◂ Prev</button>
  <button onclick="resetView()">Reset</button>
</div>
<div id="panel">
  <h2 id="blabel">Block #—</h2>
  <div id="meta">Loading diamonds.json…</div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="explorer.js"></script>
</body>
</html>
