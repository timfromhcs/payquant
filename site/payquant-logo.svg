<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="#060913"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#cyanPurple)" stroke-width="12" stroke-dasharray="10 15" filter="url(#glow)"/>
  <ellipse cx="250" cy="250" rx="180" ry="70" fill="none" stroke="#00f2fe" stroke-width="6" transform="rotate(30 250 250)" opacity="0.8"/>
  <ellipse cx="250" cy="250" rx="180" ry="70" fill="none" stroke="#9d4edd" stroke-width="6" transform="rotate(-30 250 250)" opacity="0.8"/>
  <circle cx="250" cy="250" r="45" fill="url(#cyanPurple)" filter="url(#glow)"/>
  <text x="250" y="262" font-family="'Outfit', sans-serif" font-weight="800" font-size="36" fill="#000000" text-anchor="middle">PQN</text>
</svg>
