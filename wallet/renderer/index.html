<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayQuant Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">PQ</div>
        <div>
          <h1>PayQuant Wallet</h1>
          <p class="sub">PQN | Post-Quantum ML-DSA-65 | Synergeia Mainnet</p>
        </div>
      </div>
      <div class="status">
        <span id="node-status" class="pill pill-offline">Node offline</span>
      </div>
    </header>

    <div class="settings-bar">
      <label>RPC Host <input id="rpc-host" type="text" value="127.0.0.1"></label>
      <label>Port <input id="rpc-port" type="text" value="28332"></label>
      <label>User <input id="rpc-user" type="text" value="payquantuser"></label>
      <label>Pass <input id="rpc-pass" type="password" value="payquantpass"></label>
      <button id="btn-connect" class="btn btn-start">Connect</button>
    </div>

    <main class="grid">
      <section class="card">
        <h3>Total Balance</h3>
        <div class="val" id="balance">-- PQN</div>
        <div class="sub" id="balance-unconfirmed">Pending: -- PQN</div>
        <div class="sub" id="node-info">Node info not loaded</div>
      </section>

      <section class="card">
<h3>Receive</h3>
        <div class="val small" id="receive">No address</div>
        <div style="margin-top:0.8rem; display:flex; gap:0.6rem;">
          <button id="btn-new-address" class="btn btn-start">Get New Address</button>
          <button id="btn-copy-address" class="btn">Copy</button>
        </div>
      </section>

      <section class="card full">
        <h3>Send PQN</h3>
        <div class="form-row">
          <input id="send-to" type="text" placeholder="pqn1... destination address">
          <input id="send-amount" type="text" placeholder="Amount (PQN)">
          <button id="btn-send" class="btn btn-start">Send</button>
        </div>
        <div class="sub" id="send-result"></div>
      </section>

      <section class="card full">
        <h3>Transactions</h3>
        <table class="tx-table">
          <thead>
            <tr><th>Date</th><th>Type</th><th>Address</th><th>Amount</th><th>Confirmations</th></tr>
          </thead>
          <tbody id="tx-body">
            <tr><td colspan="5" class="sub">No transactions loaded</td></tr>
          </tbody>
        </table>
      </section>

      <section class="card full">
        <h3>Console</h3>
        <pre id="console" class="console"></pre>
      </section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
