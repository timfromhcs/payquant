name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  discussions: write

jobs:
  publish-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Release Distribution Artifacts
        run: |
          mkdir -p release_dist
          tar -czf release_dist/payquant-v1.0.0-linux-x64.tar.gz src/ contrib/ doc/

      - name: Create Release via softprops
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/*
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
