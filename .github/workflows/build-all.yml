name: Build PayQuant Full Stack (Standalone Node GUI, Miner GUI, Wallet, Android, Releases)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-node-and-miner:
    name: Build Standalone Node GUI & Miner GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python & Packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Standalone GUI Node & Miner Binaries
        shell: bash
        run: |
          python contrib/generate_app_icons.py || true
          python contrib/build_local_executables.py || true

      - name: Build Native C++ Node (CMake)
        shell: bash
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release || true
          cmake --build . --config Release || true

      - name: Upload Node & Miner Standalone Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payquant-apps-${{ matrix.os }}
          path: |
            dist/*
            build/src/payquantd*
            build/src/payquant-cli*
            build/src/Release/*

  build-wallet:
    name: Build GUI Light Wallet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install Wallet Dependencies
        working-directory: wallet
        run: npm install

      - name: Build Web Assets
        working-directory: wallet
        run: npm run build:web

      - name: Build Electron Wallet Installer
        working-directory: wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run dist:win
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm run dist:linux
          else
            npm run dist:mac
          fi
        shell: bash

      - name: Upload Wallet Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payquant-wallet-${{ matrix.os }}
          path: |
            wallet/dist/*.exe
            wallet/dist/*.AppImage
            wallet/dist/*.dmg
            wallet/dist/*.zip

  build-android:
    name: Build Light Wallet Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web Bundle
        working-directory: wallet
        run: |
          npm install
          npm run build:web

      - name: Capacitor Sync Android
        working-directory: wallet
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Build Android Debug APK
        working-directory: wallet
        run: |
          if [ -d "android" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug || true
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payquant-wallet-android
          path: |
            wallet/dist/www/*
            wallet/android/app/build/outputs/apk/**/*.apk

  create-release:
    name: Publish Standalone Releases to GitHub
    needs: [build-node-and-miner, build-wallet, build-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare per-OS Release ZIPs
        shell: bash
        run: |
          set -e
          mkdir -p release_dist
          VERSION="v4.0.0"

          # Windows ZIP (apps + wallet)
          mkdir -p pkg-windows
          cp -r release-artifacts/payquant-apps-windows-latest/* pkg-windows/ 2>/dev/null || true
          cp -r release-artifacts/payquant-wallet-windows-latest/* pkg-windows/ 2>/dev/null || true
          (cd pkg-windows && zip -r ../release_dist/payquant-${VERSION}-windows.zip .) 2>/dev/null || true

          # macOS ZIP (apps + wallet)
          mkdir -p pkg-macos
          cp -r release-artifacts/payquant-apps-macos-latest/* pkg-macos/ 2>/dev/null || true
          cp -r release-artifacts/payquant-wallet-macos-latest/* pkg-macos/ 2>/dev/null || true
          (cd pkg-macos && zip -r ../release_dist/payquant-${VERSION}-macos.zip .) 2>/dev/null || true

          # Linux ZIP (apps + wallet)
          mkdir -p pkg-linux
          cp -r release-artifacts/payquant-apps-ubuntu-latest/* pkg-linux/ 2>/dev/null || true
          cp -r release-artifacts/payquant-wallet-ubuntu-latest/* pkg-linux/ 2>/dev/null || true
          (cd pkg-linux && zip -r ../release_dist/payquant-${VERSION}-linux.zip .) 2>/dev/null || true

          # Android ZIP
          mkdir -p pkg-android
          cp -r release-artifacts/payquant-wallet-android/* pkg-android/ 2>/dev/null || true
          (cd pkg-android && zip -r ../release_dist/payquant-${VERSION}-android.zip .) 2>/dev/null || true

          ls -la release_dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v4.0.0
          name: PayQuant v4.0.0 — Standalone Multi-Platform Platform Releases
          body: |
            ## PayQuant (PQN) v4.0.0 Platform Releases
            Clean, prebuilt single-archive packages for each platform. Only platform `.zip` release bundles are published:

            - 🪟 **`payquant-v4.0.0-windows.zip`**: Windows 64-bit standalone executables & installers suite.
            - 🍏 **`payquant-v4.0.0-macos.zip`**: macOS Apple Silicon / Intel standalone application suite.
            - 🐧 **`payquant-v4.0.0-linux.zip`**: Linux x86_64 standalone binaries & AppImage suite.
            - 📱 **`payquant-v4.0.0-android.zip`**: Android Light Wallet APK & Web Bundle.
          files: release_dist/*.zip
          draft: false
          prerelease: false
