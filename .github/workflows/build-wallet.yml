name: Build PayQuant Wallet

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install dependencies
        run: |
          cd wallet
          npm ci
        shell: bash
      - name: Build Windows
        working-directory: wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: payquant-wallet-win64
          path: |
            wallet/dist/*.exe
            wallet/dist/*.yml
            wallet/dist/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - name: Install dependencies
        working-directory: wallet
        run: npm install
      - name: Build Linux
        working-directory: wallet
        run: npm run dist:linux
      - uses: actions/upload-artifact@v5
        with:
          name: payquant-wallet-linux
          path: |
            wallet/dist/*.AppImage
            wallet/dist/*.snap

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install dependencies
        working-directory: wallet
        run: npm install
      - name: Build macOS
        working-directory: wallet
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v5
        with:
          name: payquant-wallet-macos
          path: |
            wallet/dist/*.dmg
            wallet/dist/*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: wallet
        run: npm install
      - name: Build web bundle
        working-directory: wallet
        run: npm run build:web
      - name: Sync Capacitor project
        working-directory: wallet
        run: npx cap add android || npx cap sync android
      - name: Build Android APK
        working-directory: wallet/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: payquant-wallet-android
          path: |
            wallet/android/app/build/outputs/apk/**/*.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true