name: PayQuant Multi-Platform CI

on:
  push:
    branches: [ main, 29.x-knots ]
  pull_request:
    branches: [ main, 29.x-knots ]

jobs:
  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            cmake_args: "-DBUILD_GUI=OFF"
          - os: windows-latest
            target: windows-x64
            cmake_args: "-DBUILD_GUI=OFF"
          - os: macos-latest
            target: macos-x64
            cmake_args: "-DBUILD_GUI=OFF"
          - os: macos-14
            target: macos-arm64
            cmake_args: "-DBUILD_GUI=OFF"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install blake3 argon2-cffi qiskit pycryptodome

      - name: Run Functional Unit Tests
        run: |
          python test/functional/payquant_tests.py

      - name: Run Quantum Sentinel Audit
        run: |
          python contrib/quantum_sentinel.py
