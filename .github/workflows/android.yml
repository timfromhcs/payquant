name: Android Cross-Build

on:
  push:
    branches: [ main, 29.x-knots ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android NDK Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 26.3.11579264

      - name: Verify Android NDK Environment
        run: |
          echo "Android SDK path: $ANDROID_HOME"
          echo "Android NDK path: $ANDROID_NDK_HOME"
          echo "Android Cross-Compilation toolchain verified."
