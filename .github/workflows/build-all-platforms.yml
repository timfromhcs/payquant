name: Build All Multi-Platform Release Binaries (Windows, Linux, macOS, Android)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Executables (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run Windows Standalone Executable Builder
        run: |
          python contrib/build_local_executables.py

      - name: Upload Windows Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payquant-binaries-windows
          path: dist/*

  build-linux:
    name: Build Linux Standalone AppImages & Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux Standalone Executables
        run: |
          python contrib/build_local_executables.py || true

      - name: Upload Linux Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payquant-binaries-linux
          path: dist/*

  build-macos:
    name: Build macOS Universal Packages (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS Binaries
        run: |
          python contrib/build_local_executables.py || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payquant-binaries-macos
          path: dist/*

  build-wallet-desktop-and-android:
    name: Build Wallet Desktop & Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Build Web Bundle
        working-directory: wallet
        run: |
          npm install
          npm run build:web

      - name: Sync Capacitor Android
        working-directory: wallet
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Build Android Debug APK
        working-directory: wallet
        run: |
          if [ -d "android" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug || true
          fi

      - name: Upload Android & Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payquant-wallet-android-apk
          path: |
            wallet/dist/www/*
            wallet/android/app/build/outputs/apk/**/*.apk

  publish-github-release:
    name: Publish Multi-Platform Release Assets to GitHub
    needs: [build-windows, build-linux, build-macos, build-wallet-desktop-and-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Release Package
        run: |
          mkdir -p final_release_assets
          cp -r release-artifacts/*/* final_release_assets/ 2>/dev/null || true
          ls -la final_release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.6.0
          name: PayQuant Multi-Platform Release v3.6.0 (Windows, Linux, macOS, Android)
          body: |
            ## PayQuant (PQN) Multi-Platform Ecosystem Release v3.6.0
            - **Native Windows Standalone Suite** (`payquant-node-gui.exe`, `payquant-miner-gui.exe`, `payquant-explorer.exe`, `payquantd.exe`).
            - **Zero-Port NAT Traversal Engine** (WebRTC DataChannels + IRC DCC + STUN UDP Hole Punching).
            - **Enterprise RocksDB Storage Engine** (Column Families, In-Memory UTXO LRU Cache, Fast-Sync Snapshots).
            - **Light Wallet App** (Windows, Linux, macOS, and Android APK).
          files: final_release_assets/*
          draft: false
          prerelease: false
