name: iOS Xcode Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios-build:
    name: Build iOS Framework & Wallet Engine
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Xcode Select
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Framework Target
        run: |
          echo "iOS Xcode Framework Build Ready for PayQuant Wallet Engine"
