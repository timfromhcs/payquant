name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'doc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp -r site/* _site/ 2>/dev/null || true
          cp -r doc/* _site/ 2>/dev/null || true
          if [ ! -f _site/index.html ]; then
            echo '<h1>🚀 PayQuant (PQN)</h1>' > _site/index.html
            echo '<p>Quantum-Safe, Self-Optimizing AI Blockchain</p>' >> _site/index.html
          fi
          if [ -f site/payquant-logo.svg ]; then
            cp site/payquant-logo.svg _site/
          fi
          if [ -f site/payquant-icon.svg ]; then
            cp site/payquant-icon.svg _site/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages Environment
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
