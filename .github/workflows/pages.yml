name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'doc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Site Directory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: |
          mkdir -p _site

          if [ -d "site" ]; then
            cp -r site/* _site/ || true
          fi

          if [ -d "doc" ]; then
            cp -r doc/* _site/ || true
          fi

          if [ -f "CNAME" ]; then
            cp CNAME _site/
          else
            echo "payquant.org" > _site/CNAME
          fi

          if [ ! -f _site/index.html ]; then
            cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayQuant (PQN)</title>
  <style>
    body { background: #0a0a1a; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .container { max-width: 600px; padding: 2rem; }
    h1 { font-size: 4rem; margin: 0; background: linear-gradient(135deg, #00d4ff, #7b2fbe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 1.2rem; color: #8899aa; }
    .badge { display: inline-block; background: #1a1a3e; padding: 0.5rem 1rem; border-radius: 20px; margin: 1rem; border: 1px solid #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 PayQuant</h1>
    <p>Quantum-Safe, Self-Optimizing AI Blockchain</p>
    <div>
      <span class="badge">🔐 Post-Quantum</span>
      <span class="badge">🤖 AI PoUW</span>
      <span class="badge">⚡ Synergeia</span>
    </div>
  </div>
</body>
</html>
EOF
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages Environment
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://payquant.org' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
