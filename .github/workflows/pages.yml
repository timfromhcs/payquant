name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'doc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-site:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Static Site Output
        run: |
          mkdir -p _site
          cp -r site/* _site/ 2>/dev/null || true
          cp -r doc/* _site/ 2>/dev/null || true
          rm -f _site/CNAME 2>/dev/null || true
          if [ ! -f _site/index.html ]; then
            echo "<h1>PayQuant Network</h1>" > _site/index.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
